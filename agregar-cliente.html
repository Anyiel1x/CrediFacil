<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Cliente - CrediFácil</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .grid-formulario { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img alt="Logo" src="img/logo.png" style="height: 40px;">
            <span>CrediFácil Financiera</span>
        </div>
        <div class="user-container"><p>Jael</p><span>👤</span></div>
    </header>

    <div class="contenedor-principal">
        <nav class="menu-lateral">
            <a href="dashboard.html">📊 Panel</a>
            <a href="clientes.html" class="activo">👤 Clientes</a>
            <a href="prestamos.html">💰 Préstamos</a>
            <a href="login.html" style="color: #d32f2f; margin-top: 20px;">🚪 Cerrar Sesión</a>
        </nav>

        <main>
            <section class="tarjeta-tabla" style="max-width: 800px; margin: 0 auto; padding: 30px;">
                <h1 class="titulo-seccion">Registrar Nuevo Cliente</h1>
                <hr style="border: 0; border-top: 1px solid var(--borde); margin: 20px 0;">
                
                <form action="clientes.html" method="GET">
                    <div class="grid-formulario">
                        <div class="form-group">
                            <label>Promotor *</label>
                            <input type="text" class="input-control" value="Agustina Cervantes" required>
                        </div>
                        <div class="form-group"><label>Nombre *</label><input type="text" class="input-control" required></div>
                        <div class="form-group"><label>Apellidos *</label><input type="text" class="input-control" required></div>
                        <div class="form-group"><label>Calle y Número *</label><input type="text" class="input-control" required></div>
                        <div class="form-group"><label>Teléfono *</label><input type="number" class="input-control" required></div>
                    </div>
                    <div class="form-group" style="margin-top: 20px; display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="moroso"><label for="moroso" style="margin:0;">Cliente moroso</label>
                    </div>
                    <button type="submit" class="btn-primario" style="width: 100%; margin-top: 20px; padding: 15px;">Registrar Cliente</button>
                </form>
            </section>
        </main>
    </div>
    <footer><p>© 2026 CrediFácil Financiera | Todos los derechos reservados</p></footer>
</body>
</html>
