<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - CrediFácil</title>
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        body { background-color: var(--primario); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .tarjeta-login { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        .tarjeta-login img { width: 150px; margin-bottom: 20px; object-fit: contain; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <main class="tarjeta-login">
        <section>
            <img src="img/logo.png" alt="Logotipo">
            <h1 style="font-size: 1.5rem; margin-bottom: 20px;">Iniciar Sesión</h1>
            <form action="dashboard.html" method="GET">
                <div class="form-group">
                    <label for="usuario">Usuario *</label>
                    <input type="text" id="usuario" name="usuario" class="input-control" value="jael" required style="width: 100%;">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" class="input-control" required style="width: 100%;">
                </div>
                <button type="submit" class="btn-primario" style="width: 100%; margin-top: 15px; padding: 12px;">Ingresar</button>
            </form>
        </section>
    </main>
</body>
</html>
