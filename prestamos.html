<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos - CrediFácil</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img alt="Logo" src="img/logo.png" style="height: 40px;">
            <span>CrediFácil Financiera</span>
        </div>
        <div class="user-container"><p>Jael</p><span>👤</span></div>
    </header>

    <div class="contenedor-principal">
        <nav class="menu-lateral">
            <a href="dashboard.html">📊 Panel</a>
            <a href="clientes.html">👤 Clientes</a>
            <a href="prestamos.html" class="activo">💰 Préstamos</a>
            <a href="login.html" style="color: #d32f2f; margin-top: 20px;">🚪 Cerrar Sesión</a>
        </nav>

        <main>
            <h1 class="titulo-seccion">Préstamos</h1>
            <section class="formulario-busqueda">
                <div style="flex: 1; max-width: 400px;">
                    <label for="cliente-buscar" style="font-size: 0.8rem; color: #666; display: block;">Cliente</label>
                    <input type="text" id="cliente-buscar" class="input-control" value="Ma. del Rosario Cervantes" style="width: 100%;">
                </div>
                <button type="button" class="btn-primario" style="margin-top: 15px;">Agregar Préstamo</button>
            </section>

            <section class="tarjeta-tabla">
                <div class="tabla-responsiva">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Cliente</th>
                                <th>Cantidad</th>
                                <th>Estado</th>
                                <th>Pagos</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td><td>Ma. del Rosario Cervantes</td><td>$10,000.00</td><td>Pagado</td><td>18 / 18</td>
                                <td><button class="btn-accion" title="Editar">✏️</button><button class="btn-accion" title="Eliminar">🗑️</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <footer><p>© 2026 CrediFácil Financiera | Todos los derechos reservados</p></footer>
</body>
</html>
